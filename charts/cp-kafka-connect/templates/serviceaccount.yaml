{{ if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  {{ if .Values.serviceAccount.name }}
  name: {{ .Values.serviceAccount.name }}
  {{ else }}
  name: {{ .Release.Name }}-cp-kafka-connect
  {{ end }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{ end }}