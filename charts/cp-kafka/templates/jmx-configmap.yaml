{{- if and .Values.prometheus.jmx.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "cp-kafka.fullname" . }}-jmx-configmap
  labels:
    app: {{ template "cp-kafka.name" . }}
    chart: {{ template "cp-kafka.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
data:
  jmx-kafka-prometheus.yml: |+
    jmxUrl: service:jmx:rmi:///jndi/rmi://localhost:{{ .Values.jmx.port }}/jmxrmi
    lowercaseOutputName: true
    lowercaseOutputLabelNames: true
    ssl: false
    whitelistObjectNames:
    - kafka.server:type=ReplicaManager,name=*
    - kafka.controller:type=KafkaController,name=*
    - kafka.server:type=BrokerTopicMetrics,name=*
    - kafka.network:type=RequestMetrics,name=RequestsPerSec,request=*
    - kafka.network:type=SocketServer,name=NetworkProcessorAvgIdlePercent
    - kafka.server:type=ReplicaFetcherManager,name=MaxLag,clientId=*
    - kafka.server:type=KafkaRequestHandlerPool,name=RequestHandlerAvgIdlePercent
    - kafka.controller:type=ControllerStats,name=*
    - kafka.server:type=SessionExpireListener,name=*
    - java.lang:type=Memory
    - java.lang:type=MemoryPool,name=*
    - java.lang:type=GarbageCollector,name=*
    rules:
    - pattern : kafka.server<type=ReplicaManager, name=(.+)><>(Value|OneMinuteRate)
      name: "cp_kafka_server_replicamanager_$1"
    - pattern : kafka.controller<type=KafkaController, name=(.+)><>Value
      name: "cp_kafka_controller_kafkacontroller_$1"
    - pattern : kafka.server<type=BrokerTopicMetrics, name=(.+)><>OneMinuteRate
      name: "cp_kafka_server_brokertopicmetrics_$1"
    - pattern : kafka.network<type=RequestMetrics, name=RequestsPerSec, request=(.+)><>OneMinuteRate
      name: "cp_kafka_network_requestmetrics_requestspersec_$1"
    - pattern : kafka.network<type=SocketServer, name=NetworkProcessorAvgIdlePercent><>Value
      name: "cp_kafka_network_socketserver_networkprocessoravgidlepercent"
    - pattern : kafka.server<type=ReplicaFetcherManager, name=MaxLag, clientId=(.+)><>Value
      name: "cp_kafka_server_replicafetchermanager_maxlag_$1"
    - pattern : kafka.server<type=KafkaRequestHandlerPool, name=RequestHandlerAvgIdlePercent><>OneMinuteRate
      name: "cp_kafka_kafkarequesthandlerpool_requesthandleravgidlepercent"
    - pattern : kafka.controller<type=ControllerStats, name=(.+)><>OneMinuteRate
      name: "cp_kafka_controller_controllerstats_$1"
    - pattern : kafka.server<type=SessionExpireListener, name=(.+)><>OneMinuteRate
      name: "cp_kafka_server_sessionexpirelistener_$1"
    # JVM memory and GC of the broker. The pool rules report each G1 region (Eden, Survivor,
    # Old Gen). The old generation's used bytes drop after each mixed collection, so its minimum
    # over a window is the closest figure to the broker's live heap. The pools' CollectionUsage
    # is not exported: on Java 8, G1 only updates it on a full GC, so for the old generation it
    # stays at 0 on a healthy broker.
    - pattern : java.lang<type=Memory><HeapMemoryUsage>(used|committed|max)
      name: "cp_kafka_jvm_memory_bytes_$1"
      labels:
        area: heap
    - pattern : java.lang<type=Memory><NonHeapMemoryUsage>(used|committed|max)
      name: "cp_kafka_jvm_memory_bytes_$1"
      labels:
        area: nonheap
    - pattern : java.lang<type=MemoryPool, name=(.+)><Usage>(used|committed|max)
      name: "cp_kafka_jvm_memory_pool_bytes_$2"
      labels:
        pool: "$1"
    - pattern : java.lang<type=GarbageCollector, name=(.+)><>CollectionCount
      name: "cp_kafka_jvm_gc_collections_total"
      type: COUNTER
      labels:
        gc: "$1"
    - pattern : java.lang<type=GarbageCollector, name=(.+)><>CollectionTime
      name: "cp_kafka_jvm_gc_collection_time_milliseconds_total"
      type: COUNTER
      labels:
        gc: "$1"
{{- end }}
